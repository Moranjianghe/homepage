<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="description" content="Moran Jianghe's personal homepage" />
    <title>Moran Jianghe · Personal Homepage</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = savedTheme === 'dark' || (savedTheme !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>MORANXIA</span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="#about" data-i18n="nav.about">About</a>
        <a href="#links" data-i18n="nav.links">Links</a>
        <div class="language-control">
          <span class="sr-only" data-i18n="language.label">Language</span>
          <button class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu" aria-label="Language">
            <img class="language-flag" src="/icons/flags/us.svg" width="18" height="14" alt="" />
            <span class="language-current">System</span>
            <span class="select-caret" aria-hidden="true"></span>
          </button>
          <div class="language-menu" id="language-menu" role="listbox" hidden>
            <button class="language-option" type="button" role="option" data-language-mode="system" aria-selected="true">
              <img class="language-option-flag" src="/icons/flags/us.svg" width="18" height="14" alt="" />
              <span data-language-label="system">System</span>
            </button>
            <button class="language-option" type="button" role="option" data-language-mode="en" aria-selected="false">
              <img src="/icons/flags/us.svg" width="18" height="14" alt="" />
              <span data-language-label="en">English</span>
            </button>
            <button class="language-option" type="button" role="option" data-language-mode="zh-TW" aria-selected="false">
              <img src="/icons/flags/tw.svg" width="18" height="14" alt="" />
              <span data-language-label="zh-TW">繁體中文</span>
            </button>
            <button class="language-option" type="button" role="option" data-language-mode="zh-CN" aria-selected="false">
              <img src="/icons/flags/cn.svg" width="18" height="14" alt="" />
              <span data-language-label="zh-CN">简体中文</span>
            </button>
          </div>
        </div>
        <label class="theme-control">
          <span class="sr-only" data-i18n="theme.label">Theme</span>
          <select class="theme-select" aria-label="Theme">
            <option value="system" data-i18n="theme.system">System</option>
            <option value="light" data-i18n="theme.lightOption">Light</option>
            <option value="dark" data-i18n="theme.darkOption">Dark</option>
          </select>
        </label>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="hero.eyebrow">PERSONAL HOMEPAGE</p>
          <h1 id="hero-title">墨染江河</h1>
          <a class="hero-link" href="#about">
            <span data-i18n="hero.cta">Learn more</span>
            <span class="link-arrow" aria-hidden="true">↘</span>
          </a>
        </div>
        <div class="hero-portrait" aria-label="Moran Jianghe's portrait" data-i18n-aria-label="avatarLabel">
          <div class="portrait-frame">
            <img src="/images/profile.webp" width="768" height="768" alt="Moran Jianghe's portrait" data-i18n-alt="avatarAlt" />
          </div>
          <p class="portrait-note">M / 01</p>
        </div>
      </section>

      <section class="content-section about-section" id="about" aria-labelledby="about-title">
        <div class="section-label"><span>01</span><span data-i18n="sections.aboutLabel">ABOUT</span></div>
        <div class="section-content">
          <h2 id="about-title" data-i18n="sections.aboutTitle">About me</h2>
          <p class="about-text" data-i18n="sections.aboutText">This is where my introduction should be. It is not written yet.</p>
        </div>
      </section>

      <section class="content-section links-section" id="links" aria-labelledby="links-title">
        <div class="section-label"><span>02</span><span data-i18n="sections.linksLabel">LINKS</span></div>
        <div class="section-content">
          <h2 id="links-title" data-i18n="sections.linksTitle">Find me online</h2>
          <div class="link-list">
            <a class="link-item" href="https://twitter.com/moranjianghe" target="_blank" rel="noreferrer">
              <span class="link-identity"><img src="/icons/twitter.svg" width="20" height="20" alt="" /><span>Twitter</span></span>
              <span class="link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="link-item" href="https://github.com/Moranjianghe" target="_blank" rel="noreferrer">
              <span class="link-identity"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C5.373 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.211 24 17.714 24 12 24 5.373 18.627 0 12 0z" /></svg><span>GitHub</span></span>
              <span class="link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="link-item" href="https://blog.moranxia.com/" target="_blank" rel="noreferrer">
              <span class="link-identity"><svg class="brand-icon" viewBox="0 0 21 24" aria-hidden="true"><path fill="currentColor" d="m10.435 0-10.435 6.052v12l10.435 5.953 10.435-6.052v-12.005zm4.803 17.109-.939.521-.939-.521v-4.169H7.505v4.174l-.94.521-.94-.521V6.887l.939-.521.939.521v4.174h5.843V6.887l.94-.521.938.521z" /></svg><span>Blog</span></span>
              <span class="link-arrow" aria-hidden="true">↗</span>
            </a>
            <a class="link-item" href="https://t.me/ink_dyeing" target="_blank" rel="noreferrer">
              <span class="link-identity"><img src="/icons/telegram.svg" width="20" height="20" alt="" /><span>Telegram</span></span>
              <span class="link-arrow" aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>墨染江河</span>
      <span>© <span id="year"></span></span>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
