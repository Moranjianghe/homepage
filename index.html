<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="description" content="Moran Jianghe's personal homepage" />
    <title>Moran Jianghe · Personal Homepage</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/images/profile-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = savedTheme === 'dark' || (savedTheme !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="nav.skip">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">
          <svg class="brand-mark-icon" viewBox="0 0 100 100" focusable="false">
            <use href="/icons/noun-ink-bottle-5605401.svg#ink-bottle" />
          </svg>
        </span>
        <span>MORANXIA</span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="#about" data-i18n="nav.about">About</a>
        <a href="#links" data-i18n="nav.links">Links</a>
        <div class="language-control">
          <span class="sr-only" data-i18n="language.label">Language</span>
          <button class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu" aria-label="Language" title="Language">
            <span class="language-current sr-only">System</span>
            <svg class="lucide-icon control-icon language-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m5 8 6 6" />
              <path d="m4 14 6-6 2-3" />
              <path d="M2 5h12" />
              <path d="M7 2h1" />
              <path d="m22 22-5-10-5 10" />
              <path d="M14 18h6" />
            </svg>
          </button>
          <div class="language-menu" id="language-menu" role="listbox" hidden>
            <button class="language-option" type="button" role="option" data-language-mode="system" aria-selected="true">
              <svg class="lucide-icon language-system-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect width="20" height="14" x="2" y="3" rx="2" />
                <line x1="8" x2="16" y1="21" y2="21" />
                <line x1="12" x2="12" y1="17" y2="21" />
              </svg>
              <span data-language-label="system">System</span>
            </button>
            <button class="language-option" type="button" role="option" data-language-mode="en" aria-selected="false">
              <img src="/icons/flags/us.svg" width="18" height="14" alt="" />
              <span data-language-label="en">English</span>
            </button>
            <button class="language-option" type="button" role="option" data-language-mode="zh-TW" aria-selected="false">
              <img src="/icons/flags/tw.svg" width="18" height="14" alt="" />
              <span data-language-label="zh-TW">繁體中文</span>
            </button>
            <button class="language-option" type="button" role="option" data-language-mode="zh-CN" aria-selected="false">
              <img src="/icons/flags/cn.svg" width="18" height="14" alt="" />
              <span data-language-label="zh-CN">简体中文</span>
            </button>
          </div>
        </div>
        <div class="theme-control">
          <span class="sr-only" data-i18n="theme.label">Theme</span>
          <button class="theme-toggle" type="button" aria-label="Theme: System" title="Theme: System" data-theme-mode="system">
            <svg class="lucide-icon theme-icon" viewBox="0 0 24 24" data-theme-icon="system" aria-hidden="true" focusable="false">
              <path d="M12 2v2" />
              <path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715" />
              <path d="M16 12a4 4 0 0 0-4-4" />
              <path d="m19 5-1.256 1.256" />
              <path d="M20 12h2" />
            </svg>
            <svg class="lucide-icon theme-icon" viewBox="0 0 24 24" data-theme-icon="light" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg class="lucide-icon theme-icon" viewBox="0 0 24 24" data-theme-icon="dark" aria-hidden="true" focusable="false">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="hero.eyebrow">PERSONAL HOMEPAGE</p>
          <h1 id="hero-title">墨染江河</h1>
          <a class="hero-link" href="#about">
            <span data-i18n="hero.cta">Learn more</span>
            <span class="link-arrow" aria-hidden="true">
              <svg class="lucide-icon" viewBox="0 0 24 24" focusable="false">
                <path d="m7 7 10 10" />
                <path d="M17 7v10H7" />
              </svg>
            </span>
          </a>
        </div>
        <div class="hero-portrait" aria-label="Moran Jianghe's portrait" data-i18n-aria-label="avatarLabel">
          <div class="portrait-frame">
            <div class="portrait-media">
              <img src="/images/profile.webp" width="768" height="768" alt="Moran Jianghe's portrait" data-i18n-alt="avatarAlt" />
            </div>
          </div>
          <p class="portrait-note">M / 01</p>
        </div>
      </section>

      <section class="content-section about-section" id="about" aria-labelledby="about-title" data-reveal>
        <div class="section-label"><span>01</span><span data-i18n="sections.aboutLabel">ABOUT</span></div>
        <div class="section-content">
          <h2 id="about-title" data-i18n="sections.aboutTitle">About me</h2>
          <p class="about-text"><del data-i18n="sections.aboutIntro">This is where my introduction should be.</del> <span data-i18n="sections.aboutPending">It is not written yet.</span></p>
        </div>
      </section>

      <section class="content-section links-section" id="links" aria-labelledby="links-title" data-reveal>
        <div class="section-label"><span>02</span><span data-i18n="sections.linksLabel">LINKS</span></div>
        <div class="section-content">
          <h2 id="links-title" data-i18n="sections.linksTitle">Find me online</h2>
          <div class="link-list">
            <a class="link-item" href="https://twitter.com/moranjianghe" target="_blank" rel="noreferrer" data-reveal data-reveal-delay="0">
              <span class="link-identity"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons/simple/twitter.svg#twitter" /></svg><span>Twitter</span></span>
              <span class="link-arrow" aria-hidden="true">
                <svg class="lucide-icon" viewBox="0 0 24 24" focusable="false">
                  <path d="M7 17 17 7" />
                  <path d="M7 7h10v10" />
                </svg>
              </span>
            </a>
            <a class="link-item" href="https://github.com/Moranjianghe" target="_blank" rel="noreferrer" data-reveal data-reveal-delay="45">
              <span class="link-identity"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons/simple/github.svg#github" /></svg><span>GitHub</span></span>
              <span class="link-arrow" aria-hidden="true">
                <svg class="lucide-icon" viewBox="0 0 24 24" focusable="false">
                  <path d="M7 17 17 7" />
                  <path d="M7 7h10v10" />
                </svg>
              </span>
            </a>
            <a class="link-item" href="https://blog.moranxia.com/" target="_blank" rel="noreferrer" data-reveal data-reveal-delay="90">
              <span class="link-identity"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons/simple/hexo.svg#hexo" /></svg><span>Blog</span></span>
              <span class="link-arrow" aria-hidden="true">
                <svg class="lucide-icon" viewBox="0 0 24 24" focusable="false">
                  <path d="M7 17 17 7" />
                  <path d="M7 7h10v10" />
                </svg>
              </span>
            </a>
            <a class="link-item" href="https://t.me/ink_dyeing" target="_blank" rel="noreferrer" data-reveal data-reveal-delay="135">
              <span class="link-identity"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons/simple/telegram.svg#telegram" /></svg><span>Telegram</span></span>
              <span class="link-arrow" aria-hidden="true">
                <svg class="lucide-icon" viewBox="0 0 24 24" focusable="false">
                  <path d="M7 17 17 7" />
                  <path d="M7 7h10v10" />
                </svg>
              </span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>墨染江河</span>
      <span>© <span id="year"></span></span>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
